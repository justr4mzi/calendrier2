<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Crossy Road</title>

  <!-- On garde le style d'origine mais on va l'écraser juste après -->
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/99/three.min.js"></script>

  <style>
    /* === CORRECTION FORCÉE DE L'AFFICHAGE === */
    
    /* 1. Force le corps de la page à prendre tout l'espace sans marges */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important; /* Interdit le scroll */
      background-color: #000 !important;
      display: block !important; /* Désactive le flexbox qui casse l'alignement */
    }

    /* 2. Force le jeu (Canvas) à coller aux bords de l'écran */
    canvas#c {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 1 !important;
      outline: none !important;
    }

    /* 3. Rend le compteur transparent et le place proprement */
    #counter {
      position: absolute !important;
      top: 20px !important;
      right: 20px !important;
      left: auto !important;
      width: auto !important;
      height: auto !important;
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      color: white !important;
      font-family: sans-serif;
      font-size: 40px !important;
      font-weight: bold !important;
      z-index: 20 !important;
      pointer-events: none; /* Laisse passer les clics au travers */
      text-shadow: 2px 2px 0px rgba(0,0,0,0.5); /* Petite ombre pour lisibilité */
    }

    /* 4. Cache définitivement les crédits ou textes parasites */
    .sign, h1, h2, #youtube-card {
      display: none !important;
    }

    /* 5. Garde les contrôles tactiles au premier plan */
    #controlls {
      position: absolute !important;
      bottom: 20px !important;
      width: 100% !important;
      z-index: 30 !important;
      pointer-events: auto !important;
    }
  </style>
</head>
<body>

  <!-- Le Jeu -->
  <canvas id="c"></canvas>

  <!-- Le Score -->
  <div id="counter">0</div>

  <!-- Les Contrôles -->
  <div id="controlls">
    <div>
      <button id="forward">
        <svg width="30" height="30" viewBox="0 0 10 10">
          <g transform="rotate(0, 5,5)">
            <path d="M5,4 L7,6 L3,6 L5,4" />
          </g>
        </svg>
      </button>
      <button id="left">
        <svg width="30" height="30" viewBox="0 0 10 10">
          <g transform="rotate(-90, 5,5)">
            <path d="M5,4 L7,6 L3,6 L5,4" />
          </g>
        </svg>
      </button>
      <button id="backward">
        <svg width="30" height="30" viewBox="0 0 10 10">
          <g transform="rotate(180, 5,5)">
            <path d="M5,4 L7,6 L3,6 L5,4" />
          </g>
        </svg>
      </button>
      <button id="right">
        <svg width="30" height="30" viewBox="0 0 10 10">
          <g transform="rotate(90, 5,5)">
            <path d="M5,4 L7,6 L3,6 L5,4" />
          </g>
        </svg>
      </button>
    </div>
  </div>

  <!-- Fin de partie -->
  <div id="end">
    <button id="retry">Retry</button>
  </div>

  <!-- Script du jeu -->
  <script src="script.js"></script>
</body>
</html>
