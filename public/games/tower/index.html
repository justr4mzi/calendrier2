<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, user-scalable=no">
    
    <title>Block Tower</title>
    
    <link rel="stylesheet" href="style.css" />
    
    <style>
        /* Je garde juste ça pour être sûr que ça prenne tout l'écran du téléphone */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #d6dee1;
        }
        #container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Je cache le footer pour que ce soit plus propre sur mobile */
        footer {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="game"></div>
        <div id="score">0</div>
        <div id="instructions">Tap to place the block</div>
        <div class="game-over">
            <h2>Game Over</h2>
            <p>You did great, you're the best.</p>
            <p>Tap to start again</p>
        </div>
        <div class="game-ready">
            <div id="start-button">Start</div>
            <div></div>
        </div>
    </div>

    <!-- Les scripts originaux -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r83/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/latest/TweenMax.min.js"></script>
    
    <!-- Ton fichier principal (c'est bien app.js) -->
    <script src="app.js"></script>

</body>
</html>
